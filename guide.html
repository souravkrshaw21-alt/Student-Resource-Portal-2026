<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KKICM Mentors</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        /* --- PREMIUM CSS --- */
        :root {
            --primary: #4f46e5; /* Indigo */
            --secondary: #ec4899; /* Pink */
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            --card-bg: #FFFF;
            --text-dark: #1e293b;
            --text-light: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #BBE0EF;
            min-height: 100vh;
            padding: 40px 20px;
        }

        /* Header Section */
        .header-section {
            text-align: center;
            margin-bottom: 50px;
        }

        .header-section h1 {
            font-size: 2.5rem;
            color: var(--text-dark);
            margin-bottom: 10px;
        }

        .header-section span {
            color: var(--primary);
            position: relative;
        }

        /* Search Bar Styling */
        .search-wrapper {
            position: relative;
            max-width: 600px;
            margin: 0 auto;
        }

        .search-wrapper input {
            width: 100%;
            padding: 18px 50px;
            border-radius: 50px;
            border: none;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-wrapper input:focus {
            box-shadow: 0 10px 25px rgba(79, 70, 229, 0.2);
            transform: scale(1.02);
        }

        .search-wrapper i {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
        }

        /* Grid Layout */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
            max-width: 1200px;
            margin: 50px auto;
        }

        /* Modern Card Design */
        .mentor-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
            border: 1px solid rgba(255,255,255,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .mentor-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }

        /* Top Color Bar on Card */
        .mentor-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
        }

        /* Avatar / Image */
        .avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            margin-bottom: 15px;
            border: 4px solid #f3f4f6;
            object-fit: cover;
            background-color: #eee;
        }

        .mentor-info h3 {
            color: var(--text-dark);
            font-size: 1.4rem;
            margin-bottom: 5px;
        }

        .mentor-info .role {
            color: var(--primary);
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .mentor-info .branch {
            color: var(--text-light);
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        /* Skills Tags */
        .skills {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-bottom: 25px;
        }

        .tag {
            background: #eff6ff;
            color: var(--primary);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
            transition: background 0.2s;
        }

        .tag:hover {
            background: var(--primary);
            color: white;
        }

        /* Action Button */
        .connect-btn {
            background: var(--text-dark);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .connect-btn:hover {
            background: var(--primary);
            box-shadow: 0 5px 15px rgba(79, 70, 229, 0.4);
        }

        .back-nav {
    max-width: 1200px;
    margin: 0 auto 20px auto;
}

.back-btn {
    text-decoration: none;
    color: var(--text-dark);
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 20px;
    background: white;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    transition: all 0.3s ease;
}

.back-btn:hover {
    color: var(--primary);
    transform: translateX(-5px);
    box-shadow: 0 6px 20px rgba(0,0,0,0.1);
}
    </style>
</head>
<body>

    <div class="back-nav">
    <a href="index.html" class="back-btn">
        <i class="fas fa-chevron-left"></i> Back
    </a>
</div>
    <div class="header-section">
        <h1>Find Your <span>Mentor</span></h1>
        <p>Connect with seniors from KKICM for guidance and projects</p>
    </div>

    <div class="search-wrapper">
        <i class="fas fa-search"></i>
        <input type="text" id="searchInput" placeholder="Search by name, skill, or branch...">
    </div>

    <div class="grid-container" id="cardContainer">
        </div>

    <script>
        // --- DATA ---
        const mentors = [
            
    { name: "Rahul Sharma", role: "Full Stack Dev", branch: "CSE 4th Year", skills: ["React", "NodeJS", "Mongo"], image: "https://ui-avatars.com/api/?name=Rahul+Sharma&background=random" },
    { name: "Sneha Gupta", role: "Data Scientist", branch: "IT 3rd Year", skills: ["Python", "ML", "Pandas"], image: "https://ui-avatars.com/api/?name=Sneha+Gupta&background=random" },
    { name: "Amit Verma", role: "App Developer", branch: "CSE 3rd Year", skills: ["Flutter", "Firebase", "Dart"], image: "https://ui-avatars.com/api/?name=Amit+Verma&background=random" },
    { name: "Priya Singh", role: "UI/UX Designer", branch: "ECE 4th Year", skills: ["Figma", "Adobe XD", "CSS"], image: "https://ui-avatars.com/api/?name=Priya+Singh&background=random" },
    { name: "Vikram Malhotra", role: "Cyber Security", branch: "CSE 2nd Year", skills: ["Kali Linux", "Networking"], image: "https://ui-avatars.com/api/?name=Vikram+Malhotra&background=random" },
    // --- Naya Data ---
    { name: "Ananya Iyer", role: "AI Engineer", branch: "CSE 4th Year", skills: ["TensorFlow", "PyTorch", "NLP"], image: "https://ui-avatars.com/api/?name=Ananya+Iyer&background=random" },
    { name: "Rohan Mehra", role: "Cloud Architect", branch: "IT 4th Year", skills: ["AWS", "Docker", "Kubernetes"], image: "https://ui-avatars.com/api/?name=Rohan+Mehra&background=random" },
    { name: "Ishita Das", role: "Blockchain Dev", branch: "CSE 3rd Year", skills: ["Solidity", "Ether.js", "Web3"], image: "https://ui-avatars.com/api/?name=Ishita+Das&background=random" },
    { name: "Arjun Kapoor", role: "Backend Dev", branch: "ECE 4th Year", skills: ["Java", "Spring Boot", "SQL"], image: "https://ui-avatars.com/api/?name=Arjun+Kapoor&background=random" },
    { name: "Megha Rao", role: "Content Strategy", branch: "MBA 2nd Year", skills: ["SEO", "Marketing", "Branding"], image: "https://ui-avatars.com/api/?name=Megha+Rao&background=random" }
];
        

        const container = document.getElementById('cardContainer');
        const searchInput = document.getElementById('searchInput');

        // --- RENDER FUNCTION ---
        function renderMentors(data) {
            container.innerHTML = "";
            
            if(data.length === 0) {
                container.innerHTML = `<h3 style="text-align:center; grid-column: 1/-1; color: #64748b;">No mentors found matching your search.</h3>`;
                return;
            }

            data.forEach(mentor => {
                let skillsHTML = mentor.skills.map(skill => `<span class="tag">${skill}</span>`).join('');
                
                let cardHTML = `
                <div class="mentor-card">
                    <img src="${mentor.image}" alt="${mentor.name}" class="avatar">
                    <div class="mentor-info">
                        <h3>${mentor.name}</h3>
                        <div class="role">${mentor.role}</div>
                        <div class="branch">${mentor.branch}</div>
                    </div>
                    <div class="skills">
                        ${skillsHTML}
                    </div>
                    <button class="connect-btn" onclick="contactMentor('${mentor.name}')">
                        Connect Now <i class="fas fa-arrow-right"></i>
                    </button>
                </div>
                `;
                container.innerHTML += cardHTML;
            });
        }

        // --- SEARCH LOGIC ---
        searchInput.addEventListener('input', (e) => {
            const val = e.target.value.toLowerCase();
            const filtered = mentors.filter(m => 
                m.name.toLowerCase().includes(val) || 
                m.role.toLowerCase().includes(val) || 
                m.skills.some(s => s.toLowerCase().includes(val))
            );
            renderMentors(filtered);
        });

        function contactMentor(name) {
            alert("Redirecting to chat with " + name);
        }

        // Initial Load
        renderMentors(mentors);

    </script>
</body>
</html>
