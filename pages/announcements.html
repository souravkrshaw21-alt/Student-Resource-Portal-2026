<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        .page_content { max-width: 800px; margin: 100px auto; padding: 20px; }
        
        .page_title {
            color: white;
            text-align: center; font-size: 2.2rem;
            margin-bottom: 40px; text-shadow: 0 4px 10px rgba(0,0,0,0.5); font-weight: 700;
        }

        .announce_card { 
            background: rgba(255, 255, 255, 0.95); 
            padding: 25px; 
            border-radius: 12px; 
            margin-bottom: 20px; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.1); 
            border-left: 5px solid var(--accent-gold); 
            backdrop-filter: blur(5px);
            animation: fadeInUp 0.5s ease forwards;
        }

        .date_badge { 
            background: #f0f0f0; color: #555; 
            font-size: 0.8rem; padding: 4px 10px; 
            border-radius: 4px; display: inline-block; 
            margin-bottom: 10px; font-weight: 600;
        }
        
        h2 { color: var(--primary-green); margin-bottom: 10px; font-size: 1.4rem; }
        p { color: #555; line-height: 1.6; }
        
        .loading_msg { color: white; text-align: center; font-size: 1.2rem; }
        .download_link { 
            display: inline-block; margin-top: 10px; 
            color: var(--primary-green); font-weight: 600; 
            text-decoration: none; 
        }
        .download_link:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <video autoplay loop muted playsinline class="back-video">
        <source src="../assets/images/background.mp4" type="video/mp4">
    </video>
    <div class="video_overlay"></div>

    <header class="top_header">
        <div class="header_left">
            <div class="menu_toggle_btn" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></div>
            <div style="display: flex; align-items: center; gap: 10px;">
                <i class="fa-solid fa-bullhorn" style="color:white;"></i>
                <div class="portal_title">Announcements</div>
            </div>
        </div>
        <div class="header_right">
            <a href="../login.html" class="nav_login_btn">Login <i class="fa-solid fa-arrow-right"></i></a>
        </div>
    </header>

    <div class="sidebar_overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
    <div class="sidebar" id="sidebar">
        <div class="sidebar_header"><h3>KKCEM Portal</h3><div class="menu_toggle_btn" onclick="closeSidebar()"><i class="fa-solid fa-times"></i></div></div>
        <ul class="menu_list">
            <li><a href="../index.html"><i class="fa-solid fa-house"></i> Home</a></li>
            <li><a href="#" onclick="toggleSubMenu('aboutSub')"><i class="fa-solid fa-landmark"></i> About <i class="fa-solid fa-chevron-down"></i></a>
                <ul class="sub_menu" id="aboutSub">
                    <li><a href="about/academics.html">Academics</a></li>
                    <li><a href="about/admissions.html">Admissions</a></li>
                    <li><a href="about/placements.html">Placements</a></li>
                </ul>
            </li>
            <li><a href="announcements.html" class="active"><i class="fa-solid fa-bullhorn"></i> Announcements</a></li>
            <li><a href="about/contact.html"><i class="fa-solid fa-phone"></i> Contact</a></li>
            <li><a href="https://jutranchi.ac.in/?page_id=1113" target="_blank"><i class="fa-solid fa-university"></i> JUT Notices</a></li>
            <li><a href="scholarship.html"><i class="fa-solid fa-hand-holding-dollar"></i> Scholarships</a></li>
            <li><a href="#" onclick="openSettings()"><i class="fa-solid fa-gear"></i> Settings</a></li>
        </ul>
    </div>

    <div class="page_content">
        <h1 class="page_title">Latest Updates</h1>
        <div id="announcementContainer">
            <p class="loading_msg">Fetching latest updates...</p>
        </div>
    </div>

    <script src="../js/navbar.js"></script>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

        const supabaseUrl = 'https://sbwgualposhuimvdrcst.supabase.co'
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNid2d1YWxwb3NodWltdmRyY3N0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njg0MTA0MzQsImV4cCI6MjA4Mzk4NjQzNH0.jtF7NyRe96RrFDan0TFemjPMz5uAfpDaSOJWcBiywpo'
        const supabase = createClient(supabaseUrl, supabaseKey)

        async function fetchAnnouncements() {
            const container = document.getElementById('announcementContainer');

            // Fetch from Supabase Table 'uploads' where category is 'announcement'
            const { data, error } = await supabase
                .from('uploads')
                .select('*')
                .eq('category', 'announcement')
                .order('created_at', { ascending: false });

            if (error) {
                console.error("Error:", error);
                container.innerHTML = "<p style='color:white; text-align:center;'>Failed to load updates.</p>";
                return;
            }

            container.innerHTML = ""; 

            if (!data || data.length === 0) {
                container.innerHTML = "<p style='color:white; text-align:center;'>No announcements yet.</p>";
                return;
            }

            data.forEach(item => {
                // DATE FIX: Use item.created_at if exists, else default to 'Today' to prevent 1970
                const rawDate = item.created_at ? new Date(item.created_at) : new Date();
                const date = rawDate.toLocaleDateString("en-US", { year: 'numeric', month: 'short', day: 'numeric' });
                
                let attachmentHTML = "";
                if(item.file_url) {
                    attachmentHTML = `<a href="${item.file_url}" target="_blank" class="download_link"><i class="fa-solid fa-paperclip"></i> View Attachment</a>`;
                }

                const card = document.createElement('div');
                card.className = "announce_card";
                card.innerHTML = `
                    <span class="date_badge"><i class="fa-regular fa-calendar"></i> ${date}</span>
                    <h2>${item.title}</h2>
                    <p>${item.desc || ""}</p>
                    ${attachmentHTML}
                `;
                container.appendChild(card);
            });
        }

        fetchAnnouncements();
    </script>

</body>
</html>
